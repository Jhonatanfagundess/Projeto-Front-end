<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes Express</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Raízes Express</h1>
        <p>Faça seu pedido online</p>
    </header>

    <main>
        <!-- Login / Cadastro -->
        <section id="auth">
            <h2>Login / Cadastro</h2>
            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="E-mail">
                <input type="password" id="loginSenha" placeholder="Senha">
                <button id="btnLogin" class="btn">Login</button>
                <p id="msgLogin" class="mensagem"></p>
                <p>Não tem conta? <button id="mostrarCadastro" class="btn">Cadastre-se</button></p>
            </div>

            <div id="cadastroForm" style="display:none;">
                <input type="text" id="nomeCadastro" placeholder="Nome completo">
                <input type="email" id="emailCadastro" placeholder="E-mail">
                <input type="tel" id="telCadastro" placeholder="Telefone">
                <input type="password" id="senhaCadastro" placeholder="Senha">
                <label><input type="checkbox" id="lgpd"> Aceito a política de privacidade (LGPD)</label>
                <button id="btnCadastro" class="btn">Cadastrar</button>
                <p id="msgCadastro" class="mensagem"></p>
                <p>Já tem conta? <button id="mostrarLogin" class="btn">Login</button></p>
            </div>
        </section>

        <!-- Cardápio -->
        <section id="cardapio" style="display:none;">
            <h2>Cardápio</h2>
            <div id="produtos" class="produtos-container"></div>
        </section>

        <!-- Carrinho -->
        <section id="carrinho" style="display:none;">
            <h2>Carrinho</h2>
            <div id="itensCarrinho"></div>
            <p class="total">Total: R$ <span id="total">0.00</span></p>
            <button id="finalizarPedido" class="btn">Finalizar Pedido</button>
            <p id="mensagemPedido" class="mensagem"></p>
        </section>

        <!-- Cupom -->
        <section id="cupomSection" style="display:none;">
            <h2>Aplicar Cupom</h2>
            <input type="text" id="cupom" placeholder="Digite seu cupom">
            <button id="aplicarCupom" class="btn">Aplicar</button>
            <p id="resultadoCupom" class="mensagem"></p>
        </section>

        <!-- Status do Pedido -->
        <section id="statusPedido" style="display:none;">
            <h2>Status do Pedido</h2>
            <p id="statusAtual">Nenhum pedido realizado.</p>
        </section>

        <!-- Histórico -->
        <section id="historico" style="display:none;">
            <h2>Histórico de Pedidos</h2>
            <ul id="listaHistorico"></ul>
        </section>

        <!-- Perfil do Usuário -->
        <section id="perfil" style="display:none;">
            <h2>Perfil</h2>
            <input type="text" id="perfilNome" placeholder="Nome completo">
            <input type="email" id="perfilEmail" placeholder="E-mail">
            <input type="tel" id="perfilTelefone" placeholder="Telefone">
            <button id="btnAtualizarPerfil" class="btn">Atualizar Perfil</button>
            <p id="msgPerfil" class="mensagem"></p>
        </section>
    </main>

    <footer>
        <p>Raízes Express &copy; 2026</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
